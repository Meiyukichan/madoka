# 能力管理：host 半侧挂工具 / 技能门禁与目录 HTTP；client 半侧挂「设置 → 能力管理」页。
#
# 这里只放**插件内置的默认名单**，不放用户开关状态。
#
# 为什么不写 tools / skills：
#   「哪些工具被禁了」是**用户运行态**，由「能力管理」页写入 **profile 自己的**
#   cordis.patch.yml（落成一条按 id 覆盖的行）。在这里写空壳既多余又误导 ——
#   那个空 shape 由 Config schema 的 .default() 提供，删掉行为完全一致。
#
# 名单语义：
#   builtinDisabled   开箱即禁，且用户 enabled 不能恢复（UI 显示「内置禁用」徽章）
#   nonDisableable    永不禁用；同时意味着 restrict 不会命名它、UI 不下发它
#   skillNonDisableable  技能侧永不禁用
#   名字以 `*` 结尾表示前缀匹配。
#
# 📌 生产环境改名单：**不要**改本文件（装好后它在 node_modules 里，升级会被覆盖），
#    而是往 profile 的 cordis.patch.yml 写一条按 id 覆盖的行，并**完整重述** config
#    （patch 是整体替换 config，不深合并）。
#
# ⚠️ 两个不能改的地方：
#   1. `id` 就是 settings 的命名空间（`entry.options.id`），改了前端就写不回去；
#      它必须与 src/namespace.ts 的 ABILITY_NS 完全一致。
#   2. 只有「裸包名」这一行会挂载 ./client —— 不要改成 pkg/host 之类子路径。
#
# ── 默认关掉四个官方 UI 插件（本插件安装后即生效）──────────────
# 用户要的是「干净的侧栏 + 不刷账号日志」，这些都属于官方 UI 插件自带的行为：
#   ui-plugin-manager      → 侧栏「插件」行 + 插件安装页
#   entry-customization    → 侧栏/会话/右栏的「更多」菜单
#   ui-schedule            → 侧栏「自动化任务」行
#   ui-settings-account    → 设置里的「账号」页；它是唯一每轮去拉 profile/balance 的
#                            消费方（Host 的 deepseek-account 只负责执行），禁用后日志消失
#
# 两个必须一起停的坑（否则页面报 did not activate）：
#   entry-customization 的 inject 含 pluginNavigation，而它由 ui-plugin-manager 提供，
#   只停前者会让它一直 pending，Web 启动审计把 pending 当失败。
#
# 想恢复某一项：在 **profile** 的 cordis.patch.yml 写同 id 的 `disabled: false` 覆盖
# （后应用的层胜出），或删掉这里对应的三行。
- id: ui-plugin-manager
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-schedule
  disabled: true
- id: ui-settings-account
  disabled: true
- insert:
    - id: dsh-magica-rune
      name: '@meiyukichan/dsh-magica-rune'
      config:
        # ── 名单 ①：默认禁用（开箱即禁，enabled 不可恢复）──────
        # 暂为空：rune 没有自带替代品，不替用户砍 dsh 原生能力。
        builtinDisabled: []

        # ── 名单 ②：永不禁用（guard 放行 / restrict 不命名 / UI 不下发）
        nonDisableable:
          # run_code 是 PTC 呈现传输，不是能力工具（restrict 命名它会抛错）。
          # 注意：代码里另有 HARD_RESERVED 硬保护，**删掉这行也不会解除保护**。
          - run_code
          - 'sandore_*'          # 前缀匹配
          # subagent 由 tool-subagent 的「standing」形态按 agent 注册（own-layer），
          # tools.view() 不把 own 注册放进 restrictableNames，restrict 命名它会抛错，
          # 所以无法从模型工具表移除。藏不掉就不该给一个「看似能禁」的开关。
          - subagent

        # ── 名单 ③：技能侧永不禁用 ──────────────────────────
        skillNonDisableable:
          - dsh-plugins-principles
          - sandore-workflow-authoring
          - cordis-plugin-development
          - editing-cordis-compositions
