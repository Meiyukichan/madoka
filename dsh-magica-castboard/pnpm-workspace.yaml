# dsh-magica-castboard 是「单包工程」：'.' 必须在列表里，否则 pnpm 不认为它是 workspace 成员。
# packages/* 是预留位：将来把可嵌入组件（如 panel 子页面）拆成独立子包时不必改这里。
packages:
  - '.'
  - 'packages/*'

# pnpm 11 的构建脚本白名单（写在 workspace 根才生效）。
# 两个都设为 false：构建/测试都在本仓脚本里同步驱动，esbuild 的平台二进制来自
# @esbuild/win32-x64 可选依赖（不跑 postinstall 也能用）；@primno/dpapi 是可选原生依赖
# （不构建即降级 AES-256-GCM）。
allowBuilds:
  esbuild: false
  '@primno/dpapi': false

minimumReleaseAgeExclude:
  - '@meiyukichan/dsh-magica-spellbook@0.2.0-alpha.1 || 0.2.0-alpha.3'
  - '@meiyukichan/dsh-magica-teamwork@0.2.0-alpha.1 || 0.2.0-alpha.2'
